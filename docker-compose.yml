# Local development database.
#
# Nothing in the app depends on this specifically — it is ordinary Postgres over
# a connection string, so a hosted provider is just a different DATABASE_URL.
#
#   docker compose up -d
#   npm run db:migrate
#   npm run db:seed

services:
  postgres:
    image: postgres:17-alpine
    container_name: kleanchile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kleanchile
    ports:
      - "5432:5432"
    volumes:
      - kleanchile-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kleanchile"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kleanchile-pgdata:
