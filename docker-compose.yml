# Local development services.
#
# Nothing in the app depends on these specifically — Postgres is reached over a
# connection string and the bucket over the S3 API, so a hosted provider is just
# a different set of variables.
#
#   docker compose up -d
#   npm run db:migrate
#   npm run db:seed
#
# MinIO stands in for Cloudflare R2. `src/infra/storage/r2.js` speaks plain S3
# with no Cloudflare-specific calls, which is what makes that substitution
# possible — and it is the only way to exercise the presigned upload, the CORS
# preflight and the rendition pipeline without a real bucket. To use it:
#
#   R2_ACCOUNT_ID="local"                   # ignored; the endpoint is overridden
#   R2_ENDPOINT="http://localhost:9000"
#   R2_ACCESS_KEY_ID="kleanchile"
#   R2_SECRET_ACCESS_KEY="kleanchile-dev"
#   R2_BUCKET="kleanchile"
#   NEXT_PUBLIC_CDN_URL="http://localhost:9000/kleanchile"

services:
  postgres:
    image: postgres:17-alpine
    container_name: kleanchile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kleanchile
    ports:
      - "5432:5432"
    volumes:
      - kleanchile-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kleanchile"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kleanchile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kleanchile
      MINIO_ROOT_PASSWORD: kleanchile-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kleanchile-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket y lo deja de lectura pública, que es como queda un bucket de
  # R2 con dominio propio. Corre una vez y termina.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kleanchile kleanchile-dev &&
      mc mb --ignore-existing local/kleanchile &&
      mc anonymous set download local/kleanchile &&
      echo 'bucket kleanchile listo'
      "

volumes:
  kleanchile-pgdata:
  kleanchile-minio:
